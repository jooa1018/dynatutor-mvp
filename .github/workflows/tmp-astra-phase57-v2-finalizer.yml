name: Temporary Phase 57 generation-two finalizer

on:
  pull_request:
    branches:
      - tmp/astra-phase57-v2-finalizer-base-47b4af4-0828

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PARENT_SHA: 47b4af47dea188644e7ca4ad62eb1297e58b378c
      TARGET_BRANCH: codex/phase57-reproducible-public-evaluation
      PATCH_B64_SHA256: 3ecf690b86fffc4d06ed500835b589f0547707842d9f4a2be09e2320913ff125
      PATCH_GZ_SHA256: 257748987312f16a2903e3104fc86a883e6449baec138e2aba67d147016f980c
      PATCH_SHA256: f6074058c9e2394621c2fa9315ca7a473925d3285d3501d0c6d587c1788a38bb
      PYTHONHASHSEED: "0"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      ANTHROPIC_BASE_URL: ""
      MECHANICS_MODELER_BASE_URL: ""
      MECHANICS_FIGURE_BASE_URL: ""
    steps:
      - name: Check out temporary finalizer base
        uses: actions/checkout@v6
        with:
          ref: tmp/astra-phase57-v2-finalizer-base-47b4af4-0828
          fetch-depth: 0

      - name: Reconstruct and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .phase57-tmp/astra-phase57-v2.patch.gz.b64.part00 \
            > "${RUNNER_TEMP}/phase57-v2.patch.gz.b64"
          test "$(sha256sum "${RUNNER_TEMP}/phase57-v2.patch.gz.b64" | cut -d' ' -f1)" = "$PATCH_B64_SHA256"
          base64 -d "${RUNNER_TEMP}/phase57-v2.patch.gz.b64" \
            > "${RUNNER_TEMP}/phase57-v2.patch.gz"
          test "$(sha256sum "${RUNNER_TEMP}/phase57-v2.patch.gz" | cut -d' ' -f1)" = "$PATCH_GZ_SHA256"
          gzip -dc "${RUNNER_TEMP}/phase57-v2.patch.gz" \
            > "${RUNNER_TEMP}/phase57-v2.patch"
          test "$(sha256sum "${RUNNER_TEMP}/phase57-v2.patch" | cut -d' ' -f1)" = "$PATCH_SHA256"

      - name: Verify exact parent and apply one atomic commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          actual="$(git rev-parse "origin/$TARGET_BRANCH")"
          printf 'EXPECTED_PARENT=%s\nACTUAL_PARENT=%s\n' "$PARENT_SHA" "$actual"
          test "$actual" = "$PARENT_SHA"
          git checkout -B phase57-v2-finalizer "$PARENT_SHA"
          git config user.name 'OpenAI ASTRA'
          git config user.email 'astra@openai.com'
          git am "${RUNNER_TEMP}/phase57-v2.patch"

          mapfile -t paths < <(git diff-tree --no-commit-id --name-only -r HEAD | sort)
          expected=(
            .github/workflows/phase57-reproducible-public-evaluation.yml
            backend/evaluation/phase56_stage7/corpus_v2/campaign_seal.py
            backend/evaluation/phase57_reproducible/continuation_manifest.py
            backend/evaluation/phase57_reproducible/contracts.py
            backend/evaluation/phase57_reproducible/fixtures.py
            backend/evaluation/phase57_reproducible/gate.py
            backend/tests/test_phase57_continuation_manifest_v2.py
            backend/tests/test_phase57_reproducible_public_evaluation.py
          )
          printf '%s\n' "${expected[@]}" | sort > "${RUNNER_TEMP}/expected-paths"
          printf '%s\n' "${paths[@]}" > "${RUNNER_TEMP}/actual-paths"
          diff -u "${RUNNER_TEMP}/expected-paths" "${RUNNER_TEMP}/actual-paths"
          git diff --check HEAD^

      - name: Verify exact post-patch file identities
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/expected-files.sha256" <<'EOF'
          dff94cd2eb8fa7685e28023754670b4a5000c80388797e39156dca4cdcc7d1cf  .github/workflows/phase57-reproducible-public-evaluation.yml
          c03f8555064e92557b9d8378cdd333c4d86bcdc5aea772ea015e63c8dc06ed53  backend/evaluation/phase56_stage7/corpus_v2/campaign_seal.py
          e51c8a111ca50f18e37bb9f0b8b15c70267f5e1b38ff506c0b3e6c3579e55629  backend/evaluation/phase57_reproducible/continuation_manifest.py
          692b6827f5eecfa6efdb2f629d7d96fba716a276b143307bff4c58dd9ab8c99d  backend/evaluation/phase57_reproducible/contracts.py
          9aa7c480ad2aae05adc78d624e3935e09502fed0e3266f3bc26f7a023a571ad0  backend/evaluation/phase57_reproducible/fixtures.py
          dea4fc97a96f5608e9f38b2ab78e44b8b1231898fa24756f0e209f5b4676bb50  backend/evaluation/phase57_reproducible/gate.py
          d42afd18c6859e2400a10d19d774867b074fec8bcb41fa3533dd46c8274b37be  backend/tests/test_phase57_continuation_manifest_v2.py
          6efd7078b61843fc25ad7ae4f43470d454dbbd87e81e2b2d52a1a28fa7409826  backend/tests/test_phase57_reproducible_public_evaluation.py
          EOF
          sed -i 's/^          //' "${RUNNER_TEMP}/expected-files.sha256"
          sha256sum -c "${RUNNER_TEMP}/expected-files.sha256"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Compile and parse workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            backend/evaluation/phase57_reproducible \
            backend/evaluation/phase56_stage7/corpus_v2/campaign_seal.py \
            backend/tests/test_phase57_continuation_manifest_v2.py \
            backend/tests/test_phase57_reproducible_public_evaluation.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('.github/workflows/phase57-reproducible-public-evaluation.yml')
          payload = yaml.safe_load(path.read_text(encoding='utf-8'))
          assert isinstance(payload, dict)
          assert payload.get('jobs')
          PY

      - name: Run exact continuation contract suite
        working-directory: backend
        run: |
          python -m pytest -q -o 'addopts=' \
            tests/test_phase57_continuation_manifest_v2.py \
            tests/test_phase57_reproducible_public_evaluation.py \
            tests/test_phase56_stage7_supplemental_manifest.py

      - name: Fast-forward the authoritative Phase 57 branch
        shell: bash
        run: |
          set -euo pipefail
          result="$(git rev-parse HEAD)"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$PARENT_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          {
            printf 'parent_sha=%s\n' "$PARENT_SHA"
            printf 'result_sha=%s\n' "$result"
            printf 'patch_sha256=%s\n' "$PATCH_SHA256"
            printf 'changed_paths=8\n'
            printf 'phase57_manifest_digest=8dbde6de88371d08677ce56b2f58a37898bc3227d759ee4833496109723f8f44\n'
            printf 'phase57_manifest_file_sha256=2dceecd9ed7bc7249ba08acf04ba094ae3ff8628da5220f30d009e87043b73c7\n'
            printf 'phase57_selection_digest=685625cdca4089505af63b5548c61fbbf5bf65dfee131ab44da1d7fd7ece4106\n'
          } > "${RUNNER_TEMP}/phase57-v2-finalizer-report.txt"

      - name: Upload finalizer report
        uses: actions/upload-artifact@v4
        with:
          name: phase57-v2-finalizer-report
          path: ${{ runner.temp }}/phase57-v2-finalizer-report.txt
          retention-days: 7
          if-no-files-found: error
