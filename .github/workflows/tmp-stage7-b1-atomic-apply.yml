name: Temporary Stage 7 B1 atomic apply

on:
  pull_request:
    branches:
      - tmp/stage7-b1-finalizer-base-35c6ca

permissions:
  contents: write

concurrency:
  group: tmp-stage7-b1-atomic-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'tmp/stage7-b1-finalizer-trigger-35c6ca'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out temporary finalizer base
        uses: actions/checkout@v4
        with:
          ref: tmp/stage7-b1-finalizer-base-35c6ca
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Decode and verify the reviewed patch
        env:
          EXPECTED_PATCH_SHA256: e963551d90541efc46a462da05c2c34635959ba9deafa98971619ca31b49e886
        run: |
          set -euo pipefail
          test "$(find .stage7-tmp/b1-parts -maxdepth 1 -type f -name '*.part' | wc -l)" -eq 9
          cat > "$RUNNER_TEMP/b1-parts.sha256" <<'EOF'
          977b99a0f28da97a8b31b7554cb68c7e4bf8338c3c5894db84eba9ddc177302d  .stage7-tmp/b1-parts/00.part
          4f93672fafbf3aeec871434c2f64f92504f00d121a20671f3315b7d59ba41b86  .stage7-tmp/b1-parts/01.part
          affba2b91a31331af3fcf4774b8e48ca1b4e82b7d8d77ddfaa951efdb3d3b112  .stage7-tmp/b1-parts/02.part
          7880bbfb19ffda5f907207eb4eee497c566863464beef154360095390df802b1  .stage7-tmp/b1-parts/03.part
          8af63d205cdeb46ea461415f050a99b744b97a40e2f04d16da0a08f601f3928b  .stage7-tmp/b1-parts/04.part
          d4f4df4a6d9a2fb3078f67541465bfb0e99ba23e656de0d9116189f13d7b127c  .stage7-tmp/b1-parts/05.part
          90cb30fd18ab507fd438c6be5d0a69f4258f07f8dd6ec61b1a1de010577d2339  .stage7-tmp/b1-parts/06.part
          d805241f7f8d7853051325bd6f4a9c7dd81230d7eebec2abe9c7d85aba13f6fe  .stage7-tmp/b1-parts/07.part
          49acea76fadf4c1cf21a79171d2e29d9f0932c17a76445909e573d052e47fb55  .stage7-tmp/b1-parts/08.part
          EOF
          sha256sum -c "$RUNNER_TEMP/b1-parts.sha256"
          cat .stage7-tmp/b1-parts/*.part | base64 -d | gzip -d > "$RUNNER_TEMP/b1.patch"
          actual_patch_sha256="$(sha256sum "$RUNNER_TEMP/b1.patch" | awk '{print $1}')"
          printf 'PATCH_SHA256=%s\n' "$actual_patch_sha256"
          test "$actual_patch_sha256" = "$EXPECTED_PATCH_SHA256"

      - name: Verify exact parent and apply atomically
        env:
          TARGET_BRANCH: codex/phase56-generic-mechanics-engine
          EXPECTED_PARENT: 35c6ca194fd48578d0e887b5e7a5100e64808d9e
        run: |
          set -euo pipefail
          printf 'APPLY_STAGE=resolve_parent\n'
          actual_parent="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          printf 'ACTUAL_PARENT=%s\n' "$actual_parent"
          test "$actual_parent" = "$EXPECTED_PARENT"
          printf 'APPLY_STAGE=fetch_target\n'
          git fetch --quiet --depth=1 origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git checkout --quiet --detach "refs/remotes/origin/$TARGET_BRANCH"
          printf 'APPLY_STAGE=patch_check\n'
          git apply --check "$RUNNER_TEMP/b1.patch"
          printf 'APPLY_STAGE=patch_apply\n'
          git apply "$RUNNER_TEMP/b1.patch"
          git diff --check
          printf 'APPLY_STAGE=changed_paths\n'
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort)"
          expected="$(printf '%s\n' \
            backend/evaluation/phase56_stage7/complete_profile.py \
            backend/evaluation/phase56_stage7/complete_profile_application.py \
            backend/tests/test_phase56_stage7_profile_feasibility.py \
            backend/tests/test_phase56_stage7_slot_pin_frame.py | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt

      - name: Run B1 focused and adjacent regression tests
        working-directory: backend
        env:
          PYTHONHASHSEED: '0'
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
        run: |
          python -m compileall -q evaluation tests/test_phase56_stage7_slot_pin_frame.py
          python -m pytest -q \
            tests/test_phase56_stage7_slot_pin_frame.py \
            tests/test_phase56_stage7_complete_profile.py \
            tests/test_phase56_stage7_profile_application.py \
            tests/test_phase56_stage7_profile_feasibility.py::test_the_profile_table_and_enum_cannot_drift

      - name: Commit and fast-forward push the exact four-file package
        env:
          TARGET_BRANCH: codex/phase56-generic-mechanics-engine
          EXPECTED_PARENT: 35c6ca194fd48578d0e887b5e7a5100e64808d9e
        run: |
          set -euo pipefail
          git config user.name 'DynaTutor Stage 7 Finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            backend/evaluation/phase56_stage7/complete_profile.py \
            backend/evaluation/phase56_stage7/complete_profile_application.py \
            backend/tests/test_phase56_stage7_profile_feasibility.py \
            backend/tests/test_phase56_stage7_slot_pin_frame.py
          git commit -m 'eval(stage7): derive slot-pin radial frame for precise deferral'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git push origin "HEAD:$TARGET_BRANCH"
          printf 'B1_CODE_HEAD=%s\n' "$(git rev-parse HEAD)"
