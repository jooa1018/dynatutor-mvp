name: DynaTutor release tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
      - codex/phase56-generic-mechanics-engine
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynatutor-release-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  EXACT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  backend_fast:
    name: backend fast shard ${{ matrix.shard_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
      - name: Verify exact checkout
        working-directory: .
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'EXACT_HEAD_SHA=%s\nACTUAL_CHECKOUT_SHA=%s\n' "$EXACT_HEAD_SHA" "$actual"
          test "$actual" = "$EXACT_HEAD_SHA"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt
      - name: Compile backend modules
        run: python -m compileall -q app engine
      - name: Run one deterministic backend fast shard
        env:
          DYNATUTOR_BACKEND_FAST_SHARD_COUNT: "4"
          DYNATUTOR_BACKEND_FAST_SHARD_INDEX: ${{ matrix.shard_index }}
          DYNATUTOR_BACKEND_FAST_MANIFEST_OUTPUT: ${{ runner.temp }}/backend-fast-manifest-${{ matrix.shard_index }}.json
          DYNATUTOR_BACKEND_FAST_FAILURE_SUMMARY: ${{ runner.temp }}/backend-fast-failure-${{ matrix.shard_index }}.txt
        run: bash ../scripts/check_backend_fast.sh
      - name: Upload sanitized fast failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-fast-failure-summary-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard_index }}
          path: ${{ runner.temp }}/backend-fast-failure-${{ matrix.shard_index }}.txt
          if-no-files-found: warn
      - name: Upload deterministic fast manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-fast-manifest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard_index }}
          path: ${{ runner.temp }}/backend-fast-manifest-${{ matrix.shard_index }}.json
          if-no-files-found: error

  backend_fast_audit:
    name: backend fast complete partition audit
    if: always()
    needs:
      - backend_fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download every exact shard manifest
        uses: actions/download-artifact@v4
        with:
          pattern: backend-fast-manifest-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: manifests
      - name: Prove complete, disjoint, identical partition
        env:
          FAST_RESULT: ${{ needs.backend_fast.result }}
        run: |
          python - <<'PY_AUDIT'
          import json, os, pathlib
          assert os.environ['FAST_RESULT'] == 'success'
          paths = sorted(pathlib.Path('manifests').rglob('backend-fast-manifest-*.json'))
          assert len(paths) == 4, paths
          manifests = [json.loads(path.read_text()) for path in paths]
          assert len({item['sha256'] for item in manifests}) == 1
          baseline = manifests[0]
          assert baseline['excluded_file_count'] == baseline['excluded_test_count'] == 0
          assert baseline['selected_file_count'] == baseline['collected_file_count']
          assert baseline['selected_test_count'] == baseline['collected_test_count']
          files = [path for shard in baseline['shards'] for path in shard['files']]
          assert len(files) == len(set(files)) == baseline['selected_file_count']
          assert sum(shard['test_count'] for shard in baseline['shards']) == baseline['selected_test_count']
          print(json.dumps({
              'exact_head_sha': os.environ['EXACT_HEAD_SHA'],
              'manifest_sha256': baseline['sha256'],
              'selected_tests': baseline['selected_test_count'],
              'shard_test_counts': [item['test_count'] for item in baseline['shards']],
          }, sort_keys=True))
          PY_AUDIT

  backend_slow:
    name: backend slow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
      - name: Verify exact checkout
        working-directory: .
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'EXACT_HEAD_SHA=%s\nACTUAL_CHECKOUT_SHA=%s\n' "$EXACT_HEAD_SHA" "$actual"
          test "$actual" = "$EXACT_HEAD_SHA"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt
      - name: Compile backend modules
        run: python -m compileall -q app engine
      - name: Run complete backend slow wrapper
        run: bash ../scripts/check_backend_slow.sh

  backend_quality:
    name: backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
      - name: Verify exact checkout
        working-directory: .
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'EXACT_HEAD_SHA=%s\nACTUAL_CHECKOUT_SHA=%s\n' "$EXACT_HEAD_SHA" "$actual"
          test "$actual" = "$EXACT_HEAD_SHA"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt
      - name: Compile backend modules
        run: python -m compileall -q app engine
      - name: Run backend benchmark wrapper
        run: bash ../scripts/check_backend_benchmark.sh
      - name: Run backend audit wrapper
        run: bash ../scripts/check_backend_audit.sh
      - name: Run backend frontend-marker tests
        run: python -m pytest -q -o addopts= -m "frontend"
      - name: Check frontend repository metadata
        run: bash ../scripts/check_frontend_metadata.sh
      - name: Enforce warm solve latency budget
        run: >-
          python scripts/measure_phase42_latency.py
          --repeats 2
          --warmups 1
          --block-optional-dependencies
          --max-mean-ms 60
          --max-p95-ms 120
      - name: Enforce cold import and RSS budgets
        run: >-
          python scripts/measure_runtime_budget.py
          --max-import-ms 5000
          --max-rss-mb 512

  backend_performance:
    name: backend performance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out exact source head with full history
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
          fetch-depth: 0
      - name: Verify exact checkout
        working-directory: .
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'EXACT_HEAD_SHA=%s\nACTUAL_CHECKOUT_SHA=%s\n' "$EXACT_HEAD_SHA" "$actual"
          test "$actual" = "$EXACT_HEAD_SHA"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt
      - name: Measure release head performance
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/measure_pr10_hotfix_performance.py
          --output "$RUNNER_TEMP/pr10-head-performance.json"
          --repeats 30
          --warmups 5
      - name: Measure balanced PR10 performance rounds
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          round_dir="$RUNNER_TEMP/pr10-performance-rounds"
          head_worktree="$RUNNER_TEMP/dynatutor-pr-head"
          base_worktree="$RUNNER_TEMP/dynatutor-pr-base"
          mkdir -p "$round_dir"
          git worktree add --detach "$head_worktree" "$HEAD_SHA"
          git worktree add --detach "$base_worktree" "$BASE_SHA"

          for round_number in 1 2 3 4; do
            if (( round_number % 2 == 1 )); then
              order=(head base)
            else
              order=(base head)
            fi
            position=1
            for revision_label in "${order[@]}"; do
              if [[ "$revision_label" == "head" ]]; then
                revision_sha="$HEAD_SHA"
                revision_worktree="$head_worktree"
              else
                revision_sha="$BASE_SHA"
                revision_worktree="$base_worktree"
              fi
              (
                cd "$revision_worktree/backend"
                python "$head_worktree/backend/scripts/measure_pr10_hotfix_performance.py" \
                  --output "$round_dir/round-${round_number}-${revision_label}.json" \
                  --repeats 60 \
                  --warmups 10 \
                  --include-raw-samples \
                  --revision-label "$revision_label" \
                  --revision-sha "$revision_sha" \
                  --round-number "$round_number" \
                  --position "$position"
              )
              position=$((position + 1))
            done
          done
      - name: Compare pooled PR10 performance
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python "$RUNNER_TEMP/dynatutor-pr-head/backend/scripts/measure_pr10_hotfix_performance.py"
          --compare-round-dir "$RUNNER_TEMP/pr10-performance-rounds"
          --expected-rounds 4
          --expected-head-sha "$HEAD_SHA"
          --expected-base-sha "$BASE_SHA"
          --max-regression-percent 15
          --output "$RUNNER_TEMP/pr10-pooled-performance.json"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
      - name: Verify exact checkout
        working-directory: .
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'EXACT_HEAD_SHA=%s\nACTUAL_CHECKOUT_SHA=%s\n' "$EXACT_HEAD_SHA" "$actual"
          test "$actual" = "$EXACT_HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend clarification logic
        run: npm test
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

  release_gate:
    name: release gate
    if: always()
    needs:
      - backend_fast
      - backend_fast_audit
      - backend_slow
      - backend_quality
      - backend_performance
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every release gate
        env:
          FAST: ${{ needs.backend_fast.result }}
          FAST_AUDIT: ${{ needs.backend_fast_audit.result }}
          SLOW: ${{ needs.backend_slow.result }}
          QUALITY: ${{ needs.backend_quality.result }}
          PERFORMANCE: ${{ needs.backend_performance.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          printf 'head=%s fast=%s fast_audit=%s slow=%s quality=%s performance=%s frontend=%s\n' \
            "$EXACT_HEAD_SHA" "$FAST" "$FAST_AUDIT" "$SLOW" "$QUALITY" "$PERFORMANCE" "$FRONTEND"
          [[ "$FAST" == success ]]
          [[ "$FAST_AUDIT" == success ]]
          [[ "$SLOW" == success ]]
          [[ "$QUALITY" == success ]]
          [[ "$PERFORMANCE" == success ]]
          [[ "$FRONTEND" == success ]]
