name: Temporary Stage 7 B8 strict hardening finalizer

on:
  pull_request:
    branches:
      - tmp/stage7-b8-hardening-base-b8dd0ee

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARENT_SHA: b8dd0ee4853a12ad97cd865e8a2068e548a814b1
      PATCH_B64_SHA256: 237b04f1ea3bb25e456bd9ab4e0c62796259a5c3c78406798c06702219b7577f
      PATCH_GZ_SHA256: ce9fd7bf2a3a391a538485b2a289971b9a75e0f73f3c94825b46e3fe3d14749a
      PATCH_SHA256: 274a362cd9f21ce6391e135f6a6c9147b63fc0618bacecf9b80d8793f23fac37
    steps:
      - name: Check out temporary finalizer base
        uses: actions/checkout@v4
        with:
          ref: tmp/stage7-b8-hardening-base-b8dd0ee
          fetch-depth: 0
      - name: Decode and verify reviewed hardening patch
        run: |
          set -euo pipefail
          cp .stage7-tmp/b8-hardening.patch.gz.b64 "${RUNNER_TEMP}/b8-hardening.patch.gz.b64"
          test "$(sha256sum "${RUNNER_TEMP}/b8-hardening.patch.gz.b64" | cut -d' ' -f1)" = "$PATCH_B64_SHA256"
          base64 -d "${RUNNER_TEMP}/b8-hardening.patch.gz.b64" > "${RUNNER_TEMP}/b8-hardening.patch.gz"
          test "$(sha256sum "${RUNNER_TEMP}/b8-hardening.patch.gz" | cut -d' ' -f1)" = "$PATCH_GZ_SHA256"
          gzip -dc "${RUNNER_TEMP}/b8-hardening.patch.gz" > "${RUNNER_TEMP}/b8-hardening.patch"
          test "$(sha256sum "${RUNNER_TEMP}/b8-hardening.patch" | cut -d' ' -f1)" = "$PATCH_SHA256"
      - name: Verify exact parent and apply atomic commit
        run: |
          set -euo pipefail
          git fetch origin codex/phase56-generic-mechanics-engine
          actual="$(git rev-parse origin/codex/phase56-generic-mechanics-engine)"
          printf 'EXPECTED_PARENT=%s\nACTUAL_PARENT=%s\n' "$PARENT_SHA" "$actual"
          test "$actual" = "$PARENT_SHA"
          git checkout -B b8-hardening "$PARENT_SHA"
          git config user.name 'zenith go'
          git config user.email '35967220+jooa1018@users.noreply.github.com'
          git am "${RUNNER_TEMP}/b8-hardening.patch"
          mapfile -t paths < <(git diff-tree --no-commit-id --name-only -r HEAD | sort)
          expected=(
            backend/engine/mechanics/compiler/compiler.py
            backend/tests/test_phase56_stage7_offline_gate_runner.py
            backend/tools/run_phase56_stage7_offline_gate.py
          )
          printf '%s\n' "${expected[@]}" | sort > "${RUNNER_TEMP}/expected-paths"
          printf '%s\n' "${paths[@]}" > "${RUNNER_TEMP}/actual-paths"
          diff -u "${RUNNER_TEMP}/expected-paths" "${RUNNER_TEMP}/actual-paths"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
      - name: Validate B8 hardening and adjacent contracts
        working-directory: backend
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          python -m compileall -q engine/mechanics/compiler/compiler.py tools/run_phase56_stage7_offline_gate.py tests/test_phase56_stage7_offline_gate_runner.py
          git diff --check HEAD^
          python -m pytest -q -o addopts= tests/test_phase56_stage7_offline_gate_runner.py
          python -m pytest -q -o addopts= tests/test_phase56_mechanics_compiler.py
          python -m pytest -q -o addopts= \
            'tests/test_phase56_mechanics_incline_hanging_same_fixture_parity.py::test_incline_hanging_invalid_domain_fails_closed_without_legacy[zero-gravity]' \
            'tests/test_phase56_stage7_b8_incline_hanging_pulley.py::test_incline_hanging_acceleration_uses_existing_generic_laws[4-3-25-1.835208487042136]' \
            tests/test_phase56_stage7_b8_incline_hanging_pulley.py::test_closed_graph_never_routes_to_rolling_energy \
            tests/test_phase56_stage7_b8_incline_hanging_pulley.py::test_structural_near_misses_fail_closed_without_numeric_output
          python -m pytest -q -o addopts= tests/test_phase56_mechanics_polar_kinematics_same_fixture_parity.py
      - name: Fast-forward push reviewed hardening commit
        run: |
          set -euo pipefail
          git fetch origin codex/phase56-generic-mechanics-engine
          test "$(git rev-parse origin/codex/phase56-generic-mechanics-engine)" = "$PARENT_SHA"
          git push origin HEAD:refs/heads/codex/phase56-generic-mechanics-engine
