name: Temporary Stage 7 B6 atomic apply

on:
  pull_request:
    branches:
      - tmp/stage7-b6-finalizer-base-25d02d

permissions:
  contents: write

concurrency:
  group: tmp-stage7-b6-atomic-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'tmp/stage7-b6-finalizer-trigger-25d02d'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out temporary finalizer base
        uses: actions/checkout@v4
        with:
          ref: tmp/stage7-b6-finalizer-base-25d02d
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Decode and verify the reviewed patch
        env:
          EXPECTED_PATCH_SHA256: a73d47aa50aa7a9fab4bf3f9a14b2ee2e3f0719a835f4c1c2aa96d8ab31c0b0b
        run: |
          set -euo pipefail
          base64 -d .stage7-tmp/b6-direct-constant-force-work.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/b6.patch"
          actual_patch_sha256="$(sha256sum "$RUNNER_TEMP/b6.patch" | awk '{print $1}')"
          printf 'PATCH_SHA256=%s\n' "$actual_patch_sha256"
          test "$actual_patch_sha256" = "$EXPECTED_PATCH_SHA256"

      - name: Verify exact parent and apply atomically
        env:
          TARGET_BRANCH: codex/phase56-generic-mechanics-engine
          EXPECTED_PARENT: 25d02d1dc50810a7c5a53bfd18d151aa6b5f4662
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          actual_parent="$(git rev-parse "origin/$TARGET_BRANCH")"
          printf 'ACTUAL_PARENT=%s\n' "$actual_parent"
          test "$actual_parent" = "$EXPECTED_PARENT"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          git apply --check "$RUNNER_TEMP/b6.patch"
          git apply "$RUNNER_TEMP/b6.patch"
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort)"
          expected="$(printf '%s\n' \
            backend/evaluation/phase56_stage7/complete_profile.py \
            backend/evaluation/phase56_stage7/complete_profile_application.py \
            backend/evaluation/phase56_stage7/lane_b_draft_projection.py \
            backend/tests/test_phase56_stage7_direct_constant_force_work.py \
            backend/tests/test_phase56_stage7_profile_feasibility.py | sort)"
          printf 'CHANGED_PATHS=\n%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt

      - name: Run B6 focused and authority isolation tests
        working-directory: backend
        env:
          PYTHONHASHSEED: '0'
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          OPENAI_BASE_URL: ''
          ANTHROPIC_BASE_URL: ''
          MECHANICS_MODELER_BASE_URL: ''
          MECHANICS_FIGURE_BASE_URL: ''
        run: |
          python -m compileall -q engine evaluation tests/test_phase56_stage7_direct_constant_force_work.py
          python -m pytest -q \
            tests/test_phase56_stage7_direct_constant_force_work.py \
            tests/test_phase56_stage7_complete_profile.py \
            tests/test_phase56_stage7_profile_application.py \
            tests/test_phase56_stage7_lane_b_draft_projection.py \
            tests/test_phase56_stage7_lane_b_authority.py \
            tests/test_phase56_stage7_gold_isolation.py \
            tests/test_phase56_stage7_hard_safety_instruments.py \
            tests/test_phase56_stage7_profile_feasibility.py::test_the_profile_table_and_enum_cannot_drift

      - name: Run constant-force and work-energy parity tests
        working-directory: backend
        env:
          PYTHONHASHSEED: '0'
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
        run: |
          python -m pytest -q tests/test_phase56_mechanics_constant_force_work_same_fixture_parity.py
          python -m pytest -q tests/test_phase56_mechanics_work_energy_speed_same_fixture_parity.py

      - name: Commit and fast-forward push the exact five-file package
        env:
          TARGET_BRANCH: codex/phase56-generic-mechanics-engine
          EXPECTED_PARENT: 25d02d1dc50810a7c5a53bfd18d151aa6b5f4662
        run: |
          set -euo pipefail
          git config user.name 'DynaTutor Stage 7 Finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            backend/evaluation/phase56_stage7/complete_profile.py \
            backend/evaluation/phase56_stage7/complete_profile_application.py \
            backend/evaluation/phase56_stage7/lane_b_draft_projection.py \
            backend/tests/test_phase56_stage7_direct_constant_force_work.py \
            backend/tests/test_phase56_stage7_profile_feasibility.py
          git commit -m 'eval(stage7): solve direct constant-force work profiles'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git push origin "HEAD:$TARGET_BRANCH"
          printf 'B6_CODE_HEAD=%s\n' "$(git rev-parse HEAD)"
