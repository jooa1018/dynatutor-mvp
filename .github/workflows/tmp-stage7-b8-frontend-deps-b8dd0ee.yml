name: Temporary Stage 7 B8 frontend deps b8dd0ee

on:
  pull_request:
    branches:
      - tmp/stage7-b8-frontend-deps-b8dd0ee

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact authoritative source
        uses: actions/checkout@v4
        with:
          ref: b8dd0ee4853a12ad97cd865e8a2068e548a814b1
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "b8dd0ee4853a12ad97cd865e8a2068e548a814b1"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund eslint@9.39.5 eslint-config-next@15.5.18
      - name: Verify frontend lanes before export
        working-directory: frontend
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
      - name: Archive exact frontend toolchain
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/frontend-node-modules-b8dd0ee.tar.gz" -C frontend node_modules
          {
            printf 'exact_head_sha=b8dd0ee4853a12ad97cd865e8a2068e548a814b1\n'
            sha256sum frontend/package-lock.json
            sha256sum "${RUNNER_TEMP}/frontend-node-modules-b8dd0ee.tar.gz"
          } > "${RUNNER_TEMP}/frontend-node-modules-b8dd0ee.manifest.txt"
      - name: Upload exact frontend toolchain
        uses: actions/upload-artifact@v4
        with:
          name: frontend-node-modules-b8dd0ee
          path: |
            ${{ runner.temp }}/frontend-node-modules-b8dd0ee.tar.gz
            ${{ runner.temp }}/frontend-node-modules-b8dd0ee.manifest.txt
          retention-days: 1
          if-no-files-found: error
