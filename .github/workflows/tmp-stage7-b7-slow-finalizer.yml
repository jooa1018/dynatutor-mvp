name: Temporary Stage 7 B7 slow-shard finalizer

on:
  pull_request:
    branches:
      - tmp/stage7-b7-slow-finalizer-base-d59

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out temporary finalizer base
        uses: actions/checkout@v4
        with:
          ref: tmp/stage7-b7-slow-finalizer-base-d59
          fetch-depth: 0
      - name: Decode and verify reviewed patch
        run: |
          set -euo pipefail
          test "$(sha256sum .stage7-tmp/b7-slow.patch.gz.b64 | awk '{print $1}')" = "25ad91866ac44109e685414bbd407763cb4b0a920571103602e4aa04486d1ed9"
          base64 -d .stage7-tmp/b7-slow.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/b7-slow.patch"
          test "$(sha256sum "$RUNNER_TEMP/b7-slow.patch" | awk '{print $1}')" = "2ad069798a8704e821f8d4e9eb570e932bce283a10602cbc5f6e6deede094fde"
      - name: Verify exact parent and apply commit
        env:
          PARENT_SHA: d59e5acb52ace9a483cd363b108b2a5c0f3cec11
        run: |
          set -euo pipefail
          git fetch origin codex/phase56-generic-mechanics-engine
          actual="$(git rev-parse origin/codex/phase56-generic-mechanics-engine)"
          printf 'EXPECTED_PARENT=%s\nACTUAL_PARENT=%s\n' "$PARENT_SHA" "$actual"
          test "$actual" = "$PARENT_SHA"
          git checkout -B b7-slow-finalizer "$PARENT_SHA"
          git config user.name 'zenith go'
          git config user.email '35967220+jooa1018@users.noreply.github.com'
          git am "$RUNNER_TEMP/b7-slow.patch"
          test "$(git rev-list --count "$PARENT_SHA"..HEAD)" = "1"
          expected=' .github/workflows/backend-tests.yml backend/scripts/pytest_node_shards.py backend/tests/test_ci_exact_head_sharding.py backend/tests/test_pytest_node_shards.py scripts/check_backend_slow.sh '
          actual_paths=" $(git diff --name-only "$PARENT_SHA"..HEAD | sort | tr '\n' ' ')"
          test "$actual_paths" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt
      - name: Validate slow-shard contracts
        run: |
          set -euo pipefail
          PYTHONPATH=backend python -m pytest -q -o addopts='' \
            backend/tests/test_pytest_node_shards.py \
            backend/tests/test_ci_exact_head_sharding.py
          DYNATUTOR_BACKEND_SLOW_VERIFY_ONLY=1 \
          DYNATUTOR_BACKEND_SLOW_SHARD_COUNT=16 \
          DYNATUTOR_BACKEND_SLOW_SHARD_INDEX=0 \
          DYNATUTOR_BACKEND_SLOW_MANIFEST_OUTPUT="$RUNNER_TEMP/slow-manifest.json" \
            bash scripts/check_backend_slow.sh
          python - <<'PY'
          import json, os
          payload=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'slow-manifest.json')))
          assert payload['collected_test_count'] == 200
          assert [item['test_count'] for item in payload['shards']] == [13]*8 + [12]*8
          nodes=[node for shard in payload['shards'] for node in shard['nodes']]
          assert len(nodes) == len(set(nodes)) == 200
          print(payload['sha256'])
          PY
      - name: Fast-forward push reviewed commit
        run: |
          set -euo pipefail
          git fetch origin codex/phase56-generic-mechanics-engine
          test "$(git rev-parse origin/codex/phase56-generic-mechanics-engine)" = "d59e5acb52ace9a483cd363b108b2a5c0f3cec11"
          git push origin HEAD:refs/heads/codex/phase56-generic-mechanics-engine
