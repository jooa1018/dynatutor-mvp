name: Temporary Stage 7 exact-source export

on:
  push:
    branches:
      - tmp/stage7-source-export-35c6ca

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact source and Git bundle
        env:
          SOURCE_SHA: 35c6ca194fd48578d0e887b5e7a5100e64808d9e
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git archive --format=tar.gz \
            --output="${RUNNER_TEMP}/dynatutor-stage7-source-${SOURCE_SHA}.tar.gz" \
            "${SOURCE_SHA}"
          git bundle create \
            "${RUNNER_TEMP}/dynatutor-stage7-${SOURCE_SHA}.bundle" \
            "${SOURCE_SHA}"
          {
            printf 'source_sha=%s\n' "${SOURCE_SHA}"
            sha256sum "${RUNNER_TEMP}/dynatutor-stage7-source-${SOURCE_SHA}.tar.gz"
            sha256sum "${RUNNER_TEMP}/dynatutor-stage7-${SOURCE_SHA}.bundle"
          } > "${RUNNER_TEMP}/dynatutor-stage7-${SOURCE_SHA}.manifest.txt"
      - name: Upload exact-source artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynatutor-stage7-source-35c6ca194fd48578d0e887b5e7a5100e64808d9e
          path: |
            ${{ runner.temp }}/dynatutor-stage7-source-35c6ca194fd48578d0e887b5e7a5100e64808d9e.tar.gz
            ${{ runner.temp }}/dynatutor-stage7-35c6ca194fd48578d0e887b5e7a5100e64808d9e.bundle
            ${{ runner.temp }}/dynatutor-stage7-35c6ca194fd48578d0e887b5e7a5100e64808d9e.manifest.txt
          if-no-files-found: error
          retention-days: 1
