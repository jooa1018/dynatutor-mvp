name: Temporary Stage 7 exact-source export

on:
  push:
    branches:
      - tmp/stage7-source-export-35c6ca
  pull_request:
    branches:
      - tmp/stage7-source-export-35c6ca

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export exact source, Git bundle, and pinned unit wheelhouse
        env:
          SOURCE_SHA: 9c1ec669320d399247297f419862352eb3bf76bb
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git archive --format=tar.gz \
            --output="${RUNNER_TEMP}/dynatutor-stage7-source-${SOURCE_SHA}.tar.gz" \
            "${SOURCE_SHA}"
          git branch --force stage7-exact-source "${SOURCE_SHA}"
          git bundle create \
            "${RUNNER_TEMP}/dynatutor-stage7-${SOURCE_SHA}.bundle" \
            refs/heads/stage7-exact-source
          mkdir -p "${RUNNER_TEMP}/pint-wheelhouse"
          python -m pip download \
            --only-binary=:all: \
            --dest "${RUNNER_TEMP}/pint-wheelhouse" \
            pint==0.25.3
          tar -C "${RUNNER_TEMP}" -czf \
            "${RUNNER_TEMP}/pint-0.25.3-wheelhouse.tar.gz" \
            pint-wheelhouse
          {
            printf 'source_sha=%s\n' "${SOURCE_SHA}"
            sha256sum "${RUNNER_TEMP}/dynatutor-stage7-source-${SOURCE_SHA}.tar.gz"
            sha256sum "${RUNNER_TEMP}/dynatutor-stage7-${SOURCE_SHA}.bundle"
            sha256sum "${RUNNER_TEMP}/pint-0.25.3-wheelhouse.tar.gz"
          } > "${RUNNER_TEMP}/dynatutor-stage7-${SOURCE_SHA}.manifest.txt"
      - name: Upload exact-source artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynatutor-stage7-source-9c1ec669320d399247297f419862352eb3bf76bb
          path: |
            ${{ runner.temp }}/dynatutor-stage7-source-9c1ec669320d399247297f419862352eb3bf76bb.tar.gz
            ${{ runner.temp }}/dynatutor-stage7-9c1ec669320d399247297f419862352eb3bf76bb.bundle
            ${{ runner.temp }}/dynatutor-stage7-9c1ec669320d399247297f419862352eb3bf76bb.manifest.txt
            ${{ runner.temp }}/pint-0.25.3-wheelhouse.tar.gz
          if-no-files-found: error
          retention-days: 1
