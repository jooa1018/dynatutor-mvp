name: Temporary exact-source export 78594ee

on:
  pull_request:
    branches:
      - tmp/astra-source-export-base-78594ee

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact authoritative source
        uses: actions/checkout@v4
        with:
          ref: 78594eeba477ba7c43060bed270684372a357f15
          fetch-depth: 1
      - name: Export exact source
        run: |
          set -euo pipefail
          expected=78594eeba477ba7c43060bed270684372a357f15
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          git archive --format=tar.gz --output "${RUNNER_TEMP}/dynatutor-source-${expected}.tar.gz" "$expected"
          {
            printf 'exact_head_sha=%s\n' "$expected"
            sha256sum "${RUNNER_TEMP}/dynatutor-source-${expected}.tar.gz"
          } > "${RUNNER_TEMP}/dynatutor-source-${expected}.manifest.txt"
      - name: Upload exact-source artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynatutor-source-78594eeba477ba7c43060bed270684372a357f15
          path: |
            ${{ runner.temp }}/dynatutor-source-78594eeba477ba7c43060bed270684372a357f15.tar.gz
            ${{ runner.temp }}/dynatutor-source-78594eeba477ba7c43060bed270684372a357f15.manifest.txt
          retention-days: 1
          if-no-files-found: error
