name: DynaTutor closure verification

on:
  push:
    branches:
      - codex/dynatutor-astra-product-closure
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynatutor-closure-${{ github.sha }}
  cancel-in-progress: false

env:
  EXACT_HEAD_SHA: ${{ github.sha }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run audit
      - run: npm run build
        env:
          # This artifact targets an isolated local backend, never production.
          NEXT_PUBLIC_DYNATUTOR_API_BASE: http://127.0.0.1:8000
      - name: Package source-bound runtime for local browser verification
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/closure-runtime"
          git rev-parse HEAD > "$RUNNER_TEMP/closure-runtime/source-sha.txt"
          tar --exclude='__pycache__' --exclude='.env*' -czf "$RUNNER_TEMP/closure-runtime/runtime.tar.gz" \
            frontend/out backend/app backend/engine backend/requirements-lock.txt
          sha256sum "$RUNNER_TEMP/closure-runtime/runtime.tar.gz" \
            | cut -d ' ' -f 1 > "$RUNNER_TEMP/closure-runtime/archive-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: dynatutor-closure-runtime-${{ env.EXACT_HEAD_SHA }}
          path: ${{ runner.temp }}/closure-runtime/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            frontend/requirements-browser-lock.txt
      - name: Install locked real-browser test runtime
        run: python -m pip install -r ../backend/requirements-lock.txt -r requirements-browser-lock.txt
      - name: Verify real SQLite cold-start and rollback regressions
        run: python -m unittest discover -s ../backend/tests -p test_notebook_concurrent_initialization.py -v
      - name: Install pinned Chromium driver browser
        run: python -m playwright install --with-deps chromium
      - name: Verify the real built product in Chromium
        run: python tests/product-browser.py --root .. --output-dir "$RUNNER_TEMP/closure-browser" --head-sha "$EXACT_HEAD_SHA"
      - name: Upload authored product evidence, never public benchmark cases
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dynatutor-closure-browser-${{ env.EXACT_HEAD_SHA }}
          path: |
            ${{ runner.temp }}/closure-browser/*.json
            ${{ runner.temp }}/closure-browser/*.png
            ${{ runner.temp }}/closure-browser/*.log
          if-no-files-found: warn
          retention-days: 7

  public-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      PYTHONHASHSEED: '0'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_BASE_URL: ''
      ANTHROPIC_BASE_URL: ''
      MECHANICS_MODELER_BASE_URL: ''
      MECHANICS_FIGURE_BASE_URL: ''
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: python -m pip install -r backend/requirements-lock.txt
      - name: Run existing Phase 57 contract regressions
        working-directory: backend
        run: |
          python -m pytest -q -o 'addopts=' \
            tests/test_phase57_reproducible_public_evaluation.py \
            tests/test_phase57_continuation_manifest_v2.py
      - name: Run and verify the existing exact-head public campaign
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/closure-public"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/closure-before.txt"
          python backend/tools/run_phase57_reproducible_public_gate.py \
            --output-dir "$output" \
            --exact-code-head "$EXACT_HEAD_SHA" \
            --runtime-timeout-seconds 2400 | tee "$RUNNER_TEMP/closure-public.log"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/closure-after.txt"
          diff -u "$RUNNER_TEMP/closure-before.txt" "$RUNNER_TEMP/closure-after.txt"
          report_sha="$(sed -n 's/^PHASE57_REPRODUCIBLE_GATE_REPORT_RAW_SHA256=//p' "$RUNNER_TEMP/closure-public.log" | tail -n 1)"
          status_sha="$(sed -n 's/^PHASE57_REPRODUCIBLE_RUNNER_STATUS_RAW_SHA256=//p' "$RUNNER_TEMP/closure-public.log" | tail -n 1)"
          python backend/tools/check_phase57_ci_artifact_identity.py \
            --report "$output/phase57-gate-report.json" \
            --runner-status "$output/phase57-runner-status.json" \
            --expect-head-sha "$EXACT_HEAD_SHA" \
            --expect-report-raw-sha256 "$report_sha" \
            --expect-runner-status-raw-sha256 "$status_sha"
      - name: Upload only identity-verified public aggregates
        uses: actions/upload-artifact@v4
        with:
          name: dynatutor-closure-public-${{ env.EXACT_HEAD_SHA }}
          path: |
            ${{ runner.temp }}/closure-public/phase57-gate-report.json
            ${{ runner.temp }}/closure-public/phase57-runner-status.json
          if-no-files-found: error
          retention-days: 7
